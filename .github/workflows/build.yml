name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          ls /Applications | grep Xcode || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Version
        run: |
          VERSION=$(grep -m1 '^## ' StickerLab/Resources/CHANGELOG.md | sed 's/^## //' | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Versione $VERSION (build ${{ github.run_number }})"

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project StickerLab.xcodeproj \
            -scheme StickerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            build > build.log 2>&1 || {
              echo "::group::Errors"
              grep -E "error:|fatal error" build.log | sort -u | head -150
              echo "::endgroup::"
              tail -80 build.log
              exit 1
            }
          grep -E "warning:" build.log | grep "StickerLab/" | sort -u | head -50 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StickerLab.app Payload/
          zip -qry StickerLab.ipa Payload
          cp StickerLab.ipa "StickerLab-v${VERSION}.ipa"
          ls -lh *.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerLab-ipa
          path: StickerLab.ipa

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StickerLab.ipa \
            --prerelease \
            --title "Build più recente (v${VERSION} build ${BUILD})" \
            --notes "Versione ${VERSION}, build ${BUILD} (${GITHUB_SHA::7}). IPA non firmata: installala con Sideloadly, AltStore o SideStore."

      - name: Publish versioned release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes = the first section of the changelog.
          awk 'NR>1 && /^## /{exit} NR>1{print}' StickerLab/Resources/CHANGELOG.md > notes.md
          printf '\n---\nBuild %s · IPA non firmata: installala con Sideloadly, AltStore o SideStore.\n' "$BUILD" >> notes.md
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "StickerLab-v${VERSION}.ipa" --clobber
            gh release edit "v${VERSION}" --notes-file notes.md --title "StickerLab ${VERSION}"
          else
            gh release create "v${VERSION}" "StickerLab-v${VERSION}.ipa" --title "StickerLab ${VERSION}" --notes-file notes.md --latest=false
          fi

