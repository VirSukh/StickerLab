name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore: ["server/**", "**/*.md"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          ls /Applications | grep Xcode || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project StickerLab.xcodeproj \
            -scheme StickerLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Errors"
              grep -E "error:|fatal error" build.log | sort -u | head -150
              echo "::endgroup::"
              tail -80 build.log
              exit 1
            }
          grep -E "warning:" build.log | grep "StickerLab/" | sort -u | head -50 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StickerLab.app Payload/
          zip -qry StickerLab.ipa Payload
          ls -lh StickerLab.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerLab-ipa
          path: StickerLab.ipa

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StickerLab.ipa \
            --prerelease \
            --title "Build più recente" \
            --notes "IPA non firmata generata da ${GITHUB_SHA::7}. Installala con Sideloadly, AltStore o SideStore."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" StickerLab.ipa --title "StickerLab ${GITHUB_REF_NAME}" --generate-notes
