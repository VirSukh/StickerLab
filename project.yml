name: StickerLab
options:
  bundleIdPrefix: com.vir
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: 1.3.2
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  StickerLab:
    type: application
    platform: iOS
    sources:
      - path: StickerLab
    dependencies:
      - package: libwebp
      - package: ZIPFoundation
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vir.stickerlab
        PRODUCT_NAME: StickerLab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
    info:
      path: StickerLab/Info.plist
      properties:
        CFBundleDisplayName: StickerLab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes:
          - whatsapp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.vir.stickerlab
            CFBundleURLSchemes:
              - stickerlab
        CFBundleDocumentTypes:
          - CFBundleTypeName: Archivio sticker
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - com.vir.stickerlab.wastickers
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.vir.stickerlab.wastickers
            UTTypeDescription: WhatsApp Stickers
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - wastickers
